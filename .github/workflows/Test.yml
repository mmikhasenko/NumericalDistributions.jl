name: Test

on:
    push:
        branches:
            - main
        tags: ["*"]
    pull_request:
        branches: [main]
        paths:
            - ".github/workflows/**"
    workflow_dispatch:

jobs:
    test:
        uses: ./.github/workflows/ReusableTest.yml
        with:
            os: ${{ matrix.os }}
            version: ${{ matrix.version }}
            arch: ${{ matrix.arch }}
            allow_failure: ${{ matrix.allow_failure }}
            run_codecov: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
        secrets:
            codecov_token: ${{ secrets.CODECOV_TOKEN }}
        strategy:
            fail-fast: false
            matrix:
                # Keep legacy Julia on Intel; current Julia runs natively on Apple Silicon.
                include:
                    - { version: "1.7", os: ubuntu-latest, arch: x64, allow_failure: false }
                    - { version: "1.7", os: macos-15-intel, arch: x64, allow_failure: false }
                    - { version: "1.7", os: windows-latest, arch: x64, allow_failure: false }
                    - { version: "1", os: ubuntu-latest, arch: x64, allow_failure: false }
                    - { version: "1", os: macOS-latest, arch: aarch64, allow_failure: false }
                    - { version: "1", os: windows-latest, arch: x64, allow_failure: false }
